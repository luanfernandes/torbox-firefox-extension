name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: pnpm verify

      - name: Check version alignment
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./src/static/manifest.json').version")"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$manifest_version"

      - name: Create release archives
        shell: bash
        run: |
          pnpm package
          tag_version="${GITHUB_REF_NAME#v}"
          package_file="$(find web-ext-artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$package_file"
          mkdir -p release-artifacts
          cp "$package_file" "release-artifacts/torbox-web-downloads-${tag_version}-firefox-unsigned.zip"
          git archive --format=zip --prefix="torbox-firefox-extension-${tag_version}/" --output="release-artifacts/torbox-web-downloads-${tag_version}-source.zip" HEAD
          cd release-artifacts
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --prerelease --verify-tag --title "TorBox Web Downloads $GITHUB_REF_NAME developer preview" --notes-file docs/release/github-release-notes.md
